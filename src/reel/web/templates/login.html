{% extends "base.html" %}
{% block title %}Մուտք{% endblock %}
{% block content %}
<section class="card login">
  <h1>Մուտք</h1>
  <p class="muted">Մուտք գործեք ձեր email-ով (կամ օգտանունով) և գաղտնաբառով։</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Email կամ օգտանուն</label>
    <input id="username" name="username" autocomplete="username" required
           value="{{ username | default('') }}" autofocus>
    <label for="password">Գաղտնաբառ</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Մուտք գործել</button>
  </form>
  {% if registration %}<p class="small">Հաշիվ չունե՞ք։ <a href="/register">Գրանցվել</a></p>{% endif %}
</section>
{% endblock %}
