{% extends "base.html" %}
{% block title %}Գրանցում{% endblock %}
{% block content %}
<section class="card login">
  <h1>Գրանցում</h1>
  <p class="muted">Ստեղծեք հաշիվ, որ վերբեռնեք ձեր տեսանյութերը մշակման համար։ Մշակված տեսանյութը կներբեռնեք ձայնագրության էջից։</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="first_name">Անուն</label>
    <input id="first_name" name="first_name" required maxlength="100" autocomplete="given-name"
           value="{{ form.first_name | default('') }}" autofocus>
    <label for="last_name">Ազգանուն</label>
    <input id="last_name" name="last_name" required maxlength="100" autocomplete="family-name"
           value="{{ form.last_name | default('') }}">
    <label for="email">Email (մուտքի համար)</label>
    <input id="email" name="email" type="email" required maxlength="64" autocomplete="email"
           value="{{ form.email | default('') }}">
    <label for="phone">Հեռախոսահամար (ոչ պարտադիր)</label>
    <input id="phone" name="phone" type="tel" maxlength="30" autocomplete="tel"
           value="{{ form.phone | default('') }}">
    <label for="password">Գաղտնաբառ (առնվազն 10 նիշ)</label>
    <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
    <label for="password_again">Գաղտնաբառը նորից</label>
    <input id="password_again" name="password_again" type="password" required minlength="10" autocomplete="new-password">
    <button type="submit">Գրանցվել</button>
  </form>
  <p class="small">Արդեն ունե՞ք հաշիվ։ <a href="/login">Մուտք գործել</a></p>
</section>
{% endblock %}
