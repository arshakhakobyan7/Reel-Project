name: Verify Reel on Google Cloud
on:
  push:
    branches: [reel-teacher-deployment]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate to the Reel project
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: project-1659c47d-9d07-43ff-830
          workload_identity_provider: projects/742003353555/locations/global/workloadIdentityPools/reel-github/providers/reel-repository
      - name: Verify the server and public login
        run: |
          status=$(gcloud compute instances describe reel-demo --zone=europe-west3-a --format='value(status)')
          echo "Reel server status is $status"
          test "$status" = RUNNING
          curl --fail --silent --show-error --retry 2 --max-time 30 -o /dev/null https://34-185-196-76.sslip.io/login
