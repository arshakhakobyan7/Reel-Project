[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reel"
dynamic = ["version"]
description = "Lesson recordings edited and published automatically, ready the same evening."
readme = "README.md"
requires-python = ">=3.14"
# Runtime dependencies are added task by task (see TASKS.md). Every dependency must be free (D-009).
dependencies = [
    "pydantic>=2.9",        # MIT - configuration validation (T-003)
    "python-dotenv>=1.0",   # BSD-3-Clause - reads secrets from .env (T-003)
    "tzdata>=2024.1",       # Apache-2.0 - time zone database for zoneinfo on Windows (T-003)
    "sqlalchemy>=2.1,<3",   # MIT - database layer on SQLite (T-101)
    "faster-whisper>=1.1",  # MIT - local speech recognition on the CPU (T-302)
    "numpy>=1.26",          # BSD-3-Clause - frames and audio arrays (T-403)
    "onnxruntime>=1.20",    # MIT - person detector for the empty-board rule (T-403)
    "fastapi>=0.115",       # MIT - staff dashboard (T-802)
    "jinja2>=3.1",          # BSD-3-Clause - server-rendered pages (T-802)
    "python-multipart>=0.0.18",  # Apache-2.0 - HTML form parsing (T-802)
    "uvicorn>=0.32",        # BSD-3-Clause - web server for `reel serve` (T-802)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",  # BSD-3-Clause - FastAPI TestClient (T-802)
    "ruff>=0.8",
]

[project.scripts]
reel = "reel.cli:main"

[tool.setuptools.dynamic]
version = { attr = "reel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reel.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests (real models, long media)",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "scripts"]
extend-exclude = ["handoff", "samples", "data", "logs"]  # reports; private recordings and runtime files

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
